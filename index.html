<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WardOS | Clinical Intelligence Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0E14;
      --surface: #131922;
      --surface-elevated: #1B222D;
      --border: #232B3A;
      --text: #E8EDF4;
      --text-muted: #8A97AB;
      --primary: #34D399; /* using HR color as an accent */
      --primary-hover: #10B981;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .split-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .hero-section {
      flex: 1;
      background: radial-gradient(circle at center, var(--surface-elevated) 0%, var(--bg) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem;
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 500px;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .ecg-line {
      width: 120px;
      height: 24px;
      margin-top: 4px;
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.8;
      animation: dash 3s linear infinite;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-weight: 400;
    }

    .description {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .login-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background-color: var(--surface);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background-color: var(--surface-elevated);
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .login-header {
      margin-bottom: 2rem;
    }

    .login-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .role-selection {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .role-btn {
      flex: 1;
      padding: 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .role-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .role-btn.active {
      background-color: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .remember-me input[type="checkbox"] {
      accent-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'IBM Plex Sans', sans-serif;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #ffffff;
    }

    @media (max-width: 900px) {
      .split-layout {
        flex-direction: column;
      }
      .hero-section {
        flex: 0.6;
        padding: 2rem;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .login-section {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="split-layout">
    <div class="hero-section">
      <div class="hero-content">
        <div class="logo">
          WARDOS
          <svg class="ecg-line" viewBox="0 0 100 20">
            <polyline points="0,10 20,10 25,2 35,18 45,5 50,10 100,10" />
          </svg>
        </div>
        <h2 class="subtitle">Clinical Intelligence Platform</h2>
        <p class="description">Real-time wearable telemetry for safer patient monitoring. Precision instrumentation. ML-driven insights.</p>
      </div>
    </div>
    <div class="login-section">
      <div class="login-box">
        <div class="login-header">
          <h2>Sign in</h2>
          <p style="color: var(--text-muted); font-size: 0.875rem;">Select your role to continue.</p>
        </div>
        
        <div class="role-selection">
          <button class="role-btn active" data-role="nurse">Nurse</button>
          <button class="role-btn" data-role="doctor">Doctor</button>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username / Staff ID</label>
            <input type="text" id="username" class="form-control" placeholder="e.g. NRS-1042" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <div class="remember-me">
            <input type="checkbox" id="remember">
            <label for="remember" style="margin-bottom: 0;">Remember session</label>
          </div>
          <button type="submit" class="btn-submit">Sign In</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const roleBtns = document.querySelectorAll('.role-btn');
      let selectedRole = 'nurse';

      roleBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          roleBtns.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          selectedRole = e.target.getAttribute('data-role');
        });
      });

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        // Fake authentication routing
        if (selectedRole === 'nurse') {
          window.location.href = './nurse/nurse_dashboard.html';
        } else {
          window.location.href = './doctor/doctor_dashboard.html';
        }
      });
    });
  </script>
</body>
</html>
